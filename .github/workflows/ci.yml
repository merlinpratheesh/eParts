name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies
      - run: npm ci --legacy-peer-deps

      # 4. Run lint, tests, and build (for all projects)
      - run: npx nx run-many -t lint test build

      # 5. Build Angular app for GitHub Pages
      - name: Build eParts for GitHub Pages
        run: npx nx build eParts --configuration=production --base-href=/eParts/

      # 6. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
        personal_token: ${{ secrets.GH_PAT }}
        publish_dir: dist/apps/eParts


      # 7. Nx self-healing CI
      - run: npx nx fix-ci
        if: always()
