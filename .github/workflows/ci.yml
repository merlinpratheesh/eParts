name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # 2. Setup Node.js and enable caching
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies
      - run: npm ci --legacy-peer-deps

      # 4. Run lint, tests, and build (for all projects)
      - run: npx nx run-many -t lint test build

      # 5. Build only your Angular app (with correct baseHref for GitHub Pages)
      - name: Build eParts for GitHub Pages
        run: npx nx build eParts --configuration=production --base-href=/eParts/

      # 6. Deploy dist output to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/apps/eParts

      # 7. (Optional) Self-healing CI (Nx will suggest fixes if things fail)
      - run: npx nx fix-ci
        if: always()
