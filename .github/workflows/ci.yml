name: CI/CD Local Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-serve:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies
      - run: npm ci --legacy-peer-deps

      # 4. Run lint and tests
      - run: npx nx run-many -t lint test

      # 5. Build Angular app
      - name: Build eParts
        run: npx nx build eParts --configuration=production

      # 6. Install serve globally
      - name: Install serve
        run: npm install -g serve

      # 7. Serve the built app
      - name: Serve app for testing
        run: serve -s dist/apps/eParts -l 5000

      # 8. Nx self-healing CI
      - run: npx nx fix-ci
        if: always()
